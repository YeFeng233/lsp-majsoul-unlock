[package]
name = "majsoul-hook-modder"
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[lib]
name = "majsoulmodder"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
bytes = "1"
const_format = "0.2"
prost = { version = "0.14", features = ["derive"], default-features = false }
rand = { version = "0.10", features = ["thread_rng"], default-features = false }
serde = { version = "1", features = ["derive", "std"], default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
tracing = { version = "0.1", default-features = false }

[build-dependencies]
prost = { version = "0.14", default-features = false }
prost-build = { version = "0.14", default-features = false }
prost-types = "0.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
