name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the Rust protocol and local-AI test suite before building
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ARM64 debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            hook-probe/rust-modder
            hook-probe/rust-ai

      - name: Test local AI and protocol recovery
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        working-directory: hook-probe/rust-ai
        run: cargo test --release --locked

      - name: Build local AI engine
        working-directory: hook-probe/rust-ai
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          CC_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          AR_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384
        run: |
          cargo build --target aarch64-linux-android --release --locked
          mkdir -p ../build/native-libs/arm64-v8a
          cp target/aarch64-linux-android/release/libmajsoulai.so ../build/native-libs/arm64-v8a/

      - name: Build Rust modder
        working-directory: hook-probe/rust-modder
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384
        run: |
          cargo build --target aarch64-linux-android --release --locked
          mkdir -p ../build/native-libs/arm64-v8a
          cp target/aarch64-linux-android/release/libmajsoulmodder.so ../build/native-libs/arm64-v8a/

      - name: Build native hook bridge
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          NDK_CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$NDK_CLANG" --target=aarch64-linux-android29 -std=c++17 -shared -fPIC -O2 \
            -Wall -Wextra -Werror -fvisibility=hidden -fno-exceptions -fno-rtti -static-libstdc++ \
            -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384 \
            hook-probe/src/main/cpp/probe.cpp \
            -Wl,-rpath,'$ORIGIN' -L hook-probe/build/native-libs/arm64-v8a \
            -lmajsoulmodder -llog -ldl \
            -o hook-probe/build/native-libs/arm64-v8a/libmajsoulprobe.so
          "$NDK_CLANG" --target=aarch64-linux-android29 -std=c++17 -shared -fPIC -O2 \
            -Wall -Wextra -Werror -fvisibility=hidden -fno-exceptions -fno-rtti -static-libstdc++ \
            -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384 \
            hook-probe/src/main/cpp/ai_jni.cpp \
            -Wl,-rpath,'$ORIGIN' -L hook-probe/build/native-libs/arm64-v8a -lmajsoulai \
            -o hook-probe/build/native-libs/arm64-v8a/libmajsoulai_jni.so

      - name: Upload AI dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-cargo-lock
          path: hook-probe/rust-ai/Cargo.lock
          retention-days: 7

      - name: Restore persistent APK signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ci-debug.keystore"
          chmod 600 "$RUNNER_TEMP/ci-debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/ci-debug.keystore" -storepass android -alias androiddebugkey >/dev/null 2>&1

      - name: Build APK
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/ci-debug.keystore
        run: ./gradlew -p hook-probe --no-daemon -PupdateOwner=YeFeng233 -PupdateRepo=lsp-majsoul-unlock -PupdateChannel=stable -PbuildSha="${GITHUB_SHA:0:7}" assembleDebug

      - name: Verify native ELF page alignment
        shell: bash
        run: |
          APK="hook-probe/build/outputs/apk/debug/MajsoulHookProbe-debug.apk"
          LIB_DIR="$RUNNER_TEMP/majmax-apk-libs"
          mkdir -p "$LIB_DIR"
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d "$LIB_DIR"
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          python3 - "$LIB_DIR/lib/arm64-v8a" "$READELF" <<'PY'
          import pathlib, subprocess, sys
          library_dir, readelf = pathlib.Path(sys.argv[1]), sys.argv[2]
          libraries = sorted(library_dir.glob('*.so'))
          if not libraries:
              raise SystemExit('No ARM64 shared libraries found in APK')
          for library in libraries:
              output = subprocess.check_output([readelf, '-lW', str(library)], text=True)
              loads = [int(line.split()[-1], 0) for line in output.splitlines()
                       if line.lstrip().startswith('LOAD')]
              if not loads or min(loads) < 0x4000:
                  raise SystemExit(f'{library.name} has incompatible PT_LOAD alignment: {loads}')
              print(f'{library.name}: PT_LOAD alignment >= 16 KiB')
          PY

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          APK="hook-probe/build/outputs/apk/debug/MajsoulHookProbe-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          ACTUAL_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}' <<< "$CERTS" | tr -d '[:space:]:' | tr 'A-F' 'a-f')"
          echo "APK signing certificate SHA-256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = '375638284d8b7d9889ab3c0ed7afd0d597d2c648144813bb4936f37daa665c0f'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MajsoulHookProbe-debug
          path: hook-probe/build/outputs/apk/debug/MajsoulHookProbe-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APK="hook-probe/build/outputs/apk/debug/MajsoulHookProbe-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$($AAPT dump badging "$APK")"
          VERSION_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          VERSION_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          RELEASE_APK="MajsoulMax-Hook-${VERSION_NAME}-arm64-v8a.apk"
          cp "$APK" "$RELEASE_APK"
          cat > hook-update.json <<EOF
          {
            "schemaVersion": 1,
            "applicationId": "com.yefeng.majmax.hookprobe",
            "channel": "stable",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "minSdk": 29,
            "abis": ["arm64-v8a"],
            "releaseTag": "${GITHUB_REF_NAME}",
            "assetName": "${RELEASE_APK}"
          }
          EOF

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hook-update.json
            MajsoulMax-Hook-*-arm64-v8a.apk
