name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the Rust protocol and local-AI test suite before building
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ARM64 and universal APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -s "release-notes/$RELEASE_TAG.md"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            hook-probe/rust-modder -> ../build/rust
            hook-probe/rust-ai -> ../build/rust

      - name: Test local AI and protocol recovery
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        working-directory: hook-probe/rust-ai
        run: cargo test --release --locked --target-dir ../build/rust

      - name: Build Rust engines and native bridges for all ABIs
        shell: pwsh
        run: ./hook-probe/build-native.ps1 -NdkPath "$env:ANDROID_HOME/ndk/27.2.12479018" -Abis all

      - name: Upload AI dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-cargo-lock
          path: hook-probe/rust-ai/Cargo.lock
          retention-days: 7

      - name: Restore persistent APK signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ci-debug.keystore"
          chmod 600 "$RUNNER_TEMP/ci-debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/ci-debug.keystore" -storepass android -alias androiddebugkey >/dev/null 2>&1

      - name: Build ARM64 and universal APKs
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/ci-debug.keystore
        run: ./gradlew -p hook-probe --no-daemon -PupdateOwner=YeFeng233 -PupdateRepo=lsp-majsoul-unlock -PupdateChannel=stable -PbuildSha="${GITHUB_SHA:0:7}" assembleDebug

      - name: Verify native ABI completeness, dependencies and alignment
        shell: bash
        run: |
          python3 tools/verify_native_apk.py hook-probe/build/outputs/apk/arm64/debug/MajsoulHookProbe-arm64-debug.apk --abis arm64-v8a
          python3 tools/verify_native_apk.py hook-probe/build/outputs/apk/universal/debug/MajsoulHookProbe-universal-debug.apk --abis arm64-v8a armeabi-v7a x86 x86_64

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          for APK in hook-probe/build/outputs/apk/{arm64,universal}/debug/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
            CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
            ACTUAL_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}' <<< "$CERTS" | tr -d '[:space:]:' | tr 'A-F' 'a-f')"
            echo "$APK signing certificate SHA-256: $ACTUAL_SHA256"
            test "$ACTUAL_SHA256" = '375638284d8b7d9889ab3c0ed7afd0d597d2c648144813bb4936f37daa665c0f'
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MajsoulHookProbe-arm64-and-universal
          path: |
            hook-probe/build/outputs/apk/arm64/debug/*.apk
            hook-probe/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APK="hook-probe/build/outputs/apk/universal/debug/MajsoulHookProbe-universal-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$($AAPT dump badging "$APK")"
          VERSION_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          VERSION_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          test "$GITHUB_REF_NAME" = "v$VERSION_NAME"
          RELEASE_APK="MajsoulMax-Hook-${VERSION_NAME}-universal.apk"
          ARM64_APK="MajsoulMax-Hook-${VERSION_NAME}-arm64-v8a.apk"
          cp "$APK" "$RELEASE_APK"
          cp hook-probe/build/outputs/apk/arm64/debug/MajsoulHookProbe-arm64-debug.apk "$ARM64_APK"
          cat > hook-update.json <<EOF
          {
            "schemaVersion": 1,
            "applicationId": "com.yefeng.majmax.hookprobe",
            "channel": "stable",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "minSdk": 29,
            "abis": ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"],
            "releaseTag": "${GITHUB_REF_NAME}",
            "assetName": "${RELEASE_APK}",
            "variants": [
              {"assetName": "${ARM64_APK}", "abis": ["arm64-v8a"]},
              {"assetName": "${RELEASE_APK}", "abis": ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]}
            ]
          }
          EOF

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            hook-update.json
            MajsoulMax-Hook-*-arm64-v8a.apk
            MajsoulMax-Hook-*-universal.apk
