[package]
name = "native_bot"
version = "0.1.0"
edition = "2021"
description = "Local Akagi mahjong policy inference and an experimental Mortal v4 port for four players and sanma."
# Existing Akagi code: Apache-2.0. Mortal-derived modules: AGPL-3.0-only; see NOTICE-Mortal.
license = "Apache-2.0 AND AGPL-3.0-only"

[lib]
name = "native_bot"

[[bin]]
name = "extract"
path = "src/bin/extract.rs"
required-features = ["extract"]

[features]
# `infer` pulls in candle + safetensors for the neural-net inference path.
# The obs/action codec do NOT need it, so keep it optional for a lean build.
default = ["infer"]
infer = ["dep:candle-core", "dep:candle-nn", "dep:safetensors", "dep:mortal-sp", "dep:zip"]
# `extract` gates the offline training-data extractor binary (flate2 + rayon).
extract = ["dep:rayon"]

[dependencies]
riichienv-core = "0.4.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
flate2 = "1"
rayon = { version = "1", optional = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
zip = { version = "7.2", default-features = false, optional = true }
safetensors = { version = "0.6", optional = true }
mortal-sp = { path = "../../mortal-sp", optional = true }

[dev-dependencies]
flate2 = "1"
serde_json = "1"
